name: Crear APK Android

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/android.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar archivos
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Descomprimir proyecto
        run: |
          mkdir proyecto
          unzip "*.zip" -d proyecto
          find proyecto -name settings.gradle.kts

      - name: Compilar aplicación
        run: |
          cd proyecto/LavavaPrecioAndroid
          gradle assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: LavavaPrecio-APK
          path: proyecto/LavavaPrecioAndroid/app/build/outputs/apk/debug/*.apk
